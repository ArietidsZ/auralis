# Auralis CI (specs/2026-09-05-auralis/04 P03).
#
# - Linux: Python/contract checks + Android source-built JNI (sherpa + hymt)
#   BEFORE Gradle, then unit tests, assembleDebug, lintDebug.
# - macOS: real Xcode runner — source-built static XCFramework (sherpa + llama
#   for iphoneos/iphonesimulator slices), unsigned Release device link, and
#   xcodebuild simulator build + tests via scripts/verify --scope ios. No
#   Catalyst or CLT substitute satisfies this job: build_ios_native exits 2
#   without the iPhoneOS/iPhoneSimulator SDKs, and missing simulators are
#   reported blocked (exit 2), which fails the job.
# - PR checks never download multi-GB model weights; device/model checks are
#   explicit and NOT configured here (no fake performance green lights).
#
# Action pinning: full commit SHAs verified against the official GitHub
# repositories with git ls-remote on 2026-09-07:
#   actions/checkout        v4.2.2      -> 11bd7190… (tag object)
#   actions/setup-java      v4 tag      -> cf277c60… (v4 currently derefs to v4.9.1)
#   gradle/actions          v4.4.4      -> 748248dd… (tag->commit dereference)
#   actions/upload-artifact v4.6.2      -> ea165f8d…
# python3 is preinstalled on ubuntu-latest/macos-15 runners; verify needs only
# the standard library, so no setup-python step is used.

name: ci

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  android-python:
    name: Python + Android (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA verified)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 tag commit (currently v4.9.1; SHA verified)
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4 (SHA verified)
      - name: Install pinned native toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"'
      - name: Build current pinned ASR and MT native sources
        run: python3 scripts/build_android_native --ndk "$ANDROID_HOME/ndk/27.3.13750724"
      - name: Verify (contracts + python light + gradle test/assemble/lint)
        run: python3 scripts/verify --scope android --output verify-report/android
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SHA verified)
        with:
          name: verify-report-android
          path: verify-report/android
          if-no-files-found: error

  ios:
    name: iOS build + tests (macOS)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA verified)
      - name: Fast checks before native compilation
        run: python3 scripts/verify --mode fast --output verify-report/ios/preflight
      - name: Build pinned ASR and MT native XCFramework
        run: python3 scripts/build_ios_native
      - name: Link unsigned iOS device app
        run: xcodebuild -project ios/DialectInterpreter.xcodeproj -scheme DialectInterpreter -configuration Release -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build
      - name: Verify (contracts + python light + xcodebuild build/test)
        run: python3 scripts/verify --scope ios --output verify-report/ios
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SHA verified)
        with:
          name: verify-report-ios
          path: verify-report/ios
          if-no-files-found: error

  # Not configured on purpose: real-device performance/model gates require
  # hardware runners. When a runner exists, trigger scripts/verify --scope
  # models --models-dir <path> here with the same JSON report format.
